name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify H2 and PostgreSQL suites
        run: |
          docker info
          sh ./mvnw -B verify
      - name: Require PostgreSQL tests to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('target/surefire-reports/TEST-com.example.banking.PostgresBankingApiTest.xml').getroot()
          assert int(report.attrib['tests']) > 0, 'No PostgreSQL tests executed'
          for field in ('failures', 'errors', 'skipped'):
              assert int(report.attrib[field]) == 0, f'PostgreSQL tests reported {field}'
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
